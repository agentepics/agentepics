name: Trigger skills repo reference sync

on:
  push:
    branches:
      - main
    paths:
      - "docs/epic-specification.mdx"
      - "docs/epic-runtime.mdx"
      - "docs/epic-examples.mdx"
      - "docs/specification.mdx"
      - "reference/SKILL-STANDARD.md"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in agentepics/skills
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            "https://api.github.com/repos/agentepics/skills/dispatches" \
            -d '{"event_type":"sync-reference"}'
        env:
          DISPATCH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN }}
