name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-and-repo-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repo validation
        run: ./scripts/validate.sh

  skills-ref-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install skills-ref dependencies
        working-directory: skills-ref
        run: uv sync --group dev

      - name: Run skills-ref tests
        working-directory: skills-ref
        run: uv run pytest
